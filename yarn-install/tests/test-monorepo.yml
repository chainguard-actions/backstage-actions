name: Test yarn install with monorepo structure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Ensure yarn is available
      - name: Ensure yarn is installed
        run: |
          if ! command -v yarn &>/dev/null; then
            npm install -g yarn
          fi
          yarn --version

      # Create a minimal monorepo structure with nested packages
      - name: Set up monorepo workspace
        run: |
          # Root package.json (workspaces)
          printf '{"name":"monorepo-root","version":"1.0.0","private":true,"workspaces":["packages/*"]}\n' > package.json
          touch yarn.lock

          # Create a nested package
          mkdir -p packages/pkg-a
          printf '{"name":"@test/pkg-a","version":"1.0.0","private":true}\n' > packages/pkg-a/package.json

      - id: action
        uses: .
        with:
          cache-prefix: test-monorepo
        continue-on-error: true

      - name: Assert action ran or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CACHE_HIT: ${{ steps.action.outputs.cache-hit }}
          YARN_CACHE_DIR: ${{ steps.action.outputs.yarn-cache-dir }}
        run: |
          echo "outcome: $OUTCOME"
          echo "cache-hit: $CACHE_HIT"
          echo "yarn-cache-dir: $YARN_CACHE_DIR"
          if [ "$OUTCOME" = "success" ]; then
            if [ "$CACHE_HIT" != "true" ] && [ "$CACHE_HIT" != "false" ] && [ -n "$CACHE_HIT" ]; then
              echo "FAIL: unexpected cache-hit value: '$CACHE_HIT'"
              exit 1
            fi
            echo "PASS: action succeeded with cache-hit='$CACHE_HIT'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (cache service likely unavailable under act)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Assert nested package.json is present (monorepo structure intact)
        run: |
          if [ ! -f packages/pkg-a/package.json ]; then
            echo "FAIL: nested package.json not found — monorepo structure was not set up correctly"
            exit 1
          fi
          echo "PASS: nested package.json exists"
