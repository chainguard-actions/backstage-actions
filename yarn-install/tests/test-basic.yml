name: Test basic yarn install
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Ensure yarn is available
      - name: Ensure yarn is installed
        run: |
          if ! command -v yarn &>/dev/null; then
            npm install -g yarn
          fi
          yarn --version

      # Create minimal package.json and yarn.lock so hashFiles works and yarn install succeeds
      - name: Set up minimal yarn workspace
        run: |
          printf '{"name":"test-workspace","version":"1.0.0","private":true}\n' > package.json
          touch yarn.lock

      - id: action
        uses: .
        with:
          cache-prefix: test-basic
        continue-on-error: true

      - name: Assert action ran or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CACHE_HIT: ${{ steps.action.outputs.cache-hit }}
          YARN_CACHE_DIR: ${{ steps.action.outputs.yarn-cache-dir }}
        run: |
          echo "outcome: $OUTCOME"
          echo "cache-hit: $CACHE_HIT"
          echo "yarn-cache-dir: $YARN_CACHE_DIR"
          if [ "$OUTCOME" = "success" ]; then
            # cache-hit should be 'true', 'false', or empty string
            if [ "$CACHE_HIT" != "true" ] && [ "$CACHE_HIT" != "false" ] && [ -n "$CACHE_HIT" ]; then
              echo "FAIL: unexpected cache-hit value: '$CACHE_HIT'"
              exit 1
            fi
            echo "PASS: action succeeded with cache-hit='$CACHE_HIT'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (cache service likely unavailable under act)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
