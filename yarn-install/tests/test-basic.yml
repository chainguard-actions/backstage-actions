name: Test basic yarn install
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Ensure yarn is available (act images may not have it)
      - name: Ensure yarn is installed
        run: |
          if ! command -v yarn &>/dev/null; then
            npm install -g yarn
          fi
          yarn --version

      # Set up a minimal package.json and yarn.lock so yarn install can run
      - name: Set up minimal yarn workspace
        run: |
          cp tests/fixtures/package.json "$GITHUB_WORKSPACE/package.json"
          cp tests/fixtures/yarn.lock "$GITHUB_WORKSPACE/yarn.lock"

      - id: action
        uses: .
        with:
          cache-prefix: test-basic
        continue-on-error: true

      - name: Assert action ran (cache or install completed)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CACHE_HIT: ${{ steps.action.outputs.cache-hit }}
          YARN_CACHE_DIR: ${{ steps.action.outputs.yarn-cache-dir }}
        run: |
          echo "outcome: $OUTCOME"
          echo "cache-hit: $CACHE_HIT"
          echo "yarn-cache-dir: $YARN_CACHE_DIR"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully"
            # If no cache hit, yarn-cache-dir should be populated
            if [ "$CACHE_HIT" = "true" ]; then
              echo "PASS: cache hit, yarn-cache-dir step was skipped (expected)"
            else
              if [ -z "$YARN_CACHE_DIR" ]; then
                echo "FAIL: expected yarn-cache-dir to be set when no cache hit"
                exit 1
              fi
              echo "PASS: yarn-cache-dir is '$YARN_CACHE_DIR'"
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (cache service not available under act)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Assert node_modules directory exists after successful install
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            if [ ! -d "$GITHUB_WORKSPACE/node_modules" ]; then
              CACHE_HIT="${{ steps.action.outputs.cache-hit }}"
              if [ "$CACHE_HIT" = "true" ]; then
                echo "PASS: cache hit, node_modules should be restored from cache"
              else
                echo "FAIL: node_modules not found after yarn install"
                exit 1
              fi
            else
              echo "PASS: node_modules directory exists"
            fi
          else
            echo "PASS: skipping node_modules check (action did not succeed)"
          fi
